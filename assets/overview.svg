<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Content overview</title>
  <desc id="desc">Overview of the purpose and three-stage workflow for YouTube Content.</desc>
  <rect width="1200" height="630" rx="28" fill="#F8FAFC"/>
  <style>text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
  <rect x="0" y="0" width="1200" height="18" rx="9" fill="#0F766E"/>
  <rect x="70" y="70" width="150" height="42" rx="21" fill="#CCFBF1"/>
  <text x="91" y="98" font-size="15" font-weight="700" fill="#0F766E"><tspan x="91" dy="0">RESEARCH AND KNOWLEDGE WORKFLOW</tspan></text>
  <text x="70" y="180" font-size="48" font-weight="750" fill="#0F172A"><tspan x="70" dy="0">YouTube Content</tspan></text>
  <text x="70" y="290" font-size="24" font-weight="400" fill="#475569"><tspan x="70" dy="0">Turn YouTube transcripts into evidence-linked summaries, threads, or blog</tspan><tspan x="70" dy="34">drafts.</tspan></text>
  <line x1="70" y1="410" x2="1130" y2="410" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="70" y="454" width="320" height="112" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="112" cy="494" r="18" fill="#CCFBF1"/><text x="106" y="501" font-size="20" font-weight="700" fill="#0F766E">1</text>
  <text x="145" y="491" font-size="20" font-weight="650" fill="#0F172A"><tspan x="145" dy="0">Scope the request</tspan><tspan x="145" dy="28">and inputs</tspan></text>
  <rect x="440" y="454" width="320" height="112" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="482" cy="494" r="18" fill="#CCFBF1"/><text x="476" y="501" font-size="20" font-weight="700" fill="#0F766E">2</text>
  <text x="515" y="491" font-size="20" font-weight="650" fill="#0F172A"><tspan x="515" dy="0">Run a bounded,</tspan><tspan x="515" dy="28">reviewable workflow</tspan></text>
  <rect x="810" y="454" width="320" height="112" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="852" cy="494" r="18" fill="#CCFBF1"/><text x="846" y="501" font-size="20" font-weight="700" fill="#0F766E">3</text>
  <text x="885" y="491" font-size="20" font-weight="650" fill="#0F172A"><tspan x="885" dy="0">Verify the output</tspan><tspan x="885" dy="28">and report evidence</tspan></text>
  <path d="M390 510 H435" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M760 510 H805" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/></marker></defs>
</svg>
