<text x="54" y="62" font-size="14" font-weight="750" fill="#0F766E" text-anchor="start"><tspan x="54" dy="0">EXAMPLE DOCUMENT OUTPUT</tspan></text><text x="54" y="110" font-size="31" font-weight="760" fill="#0F172A" text-anchor="start"><tspan x="54" dy="0">YouTube Content</tspan></text><rect x="70" y="175" width="1060" height="455" rx="22" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="190" y="195" width="700" height="410" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="220" y="225" width="640" height="55" rx="8" fill="#CCFBF1"/><text x="250" y="260" font-size="18" font-weight="700" fill="#0F766E" text-anchor="start"><tspan x="250" dy="0"># 00:00 intro</tspan></text><rect x="250" y="280" width="480" height="9" rx="4" fill="#CBD5E1"/><text x="250" y="335" font-size="18" font-weight="700" fill="#334155" text-anchor="start"><tspan x="250" dy="0">## 04:32 key claim</tspan></text><rect x="250" y="355" width="435" height="9" rx="4" fill="#CBD5E1"/><text x="250" y="410" font-size="18" font-weight="550" fill="#334155" text-anchor="start"><tspan x="250" dy="0">## Summary</tspan></text><rect x="250" y="430" width="390" height="9" rx="4" fill="#CBD5E1"/><text x="250" y="485" font-size="18" font-weight="550" fill="#334155" text-anchor="start"><tspan x="250" dy="0">## Blog outline</tspan></text><rect x="925" y="220" width="170" height="54" rx="27" fill="#0F766E"/><text x="1010" y="253" font-size="14" font-weight="750" fill="#FFFFFF" text-anchor="middle"><tspan x="1010" dy="0">VERIFIED</tspan></text></svg>