FF" stroke="#CBD5E1"/><circle cx="745" cy="345" r="18" fill="#CCFBF1"/><text x="745" y="351" text-anchor="middle" font-size="17" font-weight="750" fill="#0F766E">4</text><text x="773" y="350" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="773" dy="0">Content</tspan><tspan x="773" dy="23">transformer</tspan></text><path d="M895 367 L923 367" stroke="#0F766E" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="930" y="315" width="180" height="105" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="960" cy="345" r="18" fill="#CCFBF1"/><text x="960" y="351" text-anchor="middle" font-size="17" font-weight="750" fill="#0F766E">5</text><text x="988" y="350" font-size="17" font-weight="650" fill="#172033" text-anchor="start"><tspan x="988" dy="0">Source-linked</tspan><tspan x="988" dy="23">draft</tspan></text><text x="70" y="284" font-size="13" font-weight="750" fill="#0F766E" text-anchor="start"><tspan x="70" dy="0">INPUT</tspan></text><text x="930" y="284" font-size="13" font-weight="750" fill="#0F766E" text-anchor="start"><tspan x="930" dy="0">VERIFIED OUTPUT</tspan></text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0F766E"/></marker></defs></svg>